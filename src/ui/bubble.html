<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
<style>
  :root { --pad: 16px; --btn: 28px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .bubble {
    position: absolute; inset: var(--pad); overflow: hidden; background: #16181c;
    border-radius: 50%; cursor: grab; isolation: isolate;
    box-shadow: 0 3px 11px rgba(0,0,0,.34);
    transition: border-radius .25s ease;
  }
  .bubble.square { border-radius: 22%; }
  .bubble.wide { border-radius: 18px; }
  .bubble.dragging { cursor: grabbing; }
  .bubble::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16);
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  video.mirror { transform: scaleX(-1); }

  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.28); opacity: 0; transition: opacity .15s; pointer-events: none; }
  .tools {
    position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%);
    display: flex; gap: 5px; opacity: 0; transition: opacity .15s; z-index: 2;
  }
  .bubble:hover .tools, .bubble:hover .scrim { opacity: 1; }
  .bubble.dragging .tools, .bubble.dragging .scrim { opacity: 0; }
  button {
    width: var(--btn); height: var(--btn); border-radius: 50%; border: 0; padding: 0;
    background: rgba(18,19,22,.82); color: #fff; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.1);
    backdrop-filter: blur(6px);
  }
  button:hover { background: rgba(40,42,48,.95); }
  button svg { width: 55%; height: 55%; }

  .empty {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    color: rgba(255,255,255,.7); font: 500 12px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif; padding: 18%;
  }
  .empty.show { display: grid; }
</style>
</head>
<body>
<div class="bubble" id="b">
  <video id="v" autoplay muted playsinline></video>
  <div class="empty" id="empty"></div>
  <div class="scrim"></div>
  <div class="tools">
    <button id="smaller">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button id="bigger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
    </button>
    <button id="shape">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="3"/></svg>
    </button>
    <button id="hide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
  </div>
</div>
<script>
  const t = zri.t;
  document.getElementById('empty').innerHTML = t('cameraUnavailable');
  document.getElementById('smaller').title = t('smaller');
  document.getElementById('bigger').title = t('bigger');
  document.getElementById('shape').title = t('shape');
  document.getElementById('hide').title = t('hideCamera');
  const b = document.getElementById('b');
  const v = document.getElementById('v');
  const empty = document.getElementById('empty');
  let stream = null;
  let camId = undefined;

  async function startCamera(id) {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          deviceId: id ? { exact: id } : undefined,
          width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 },
        },
      });
      v.srcObject = stream;
      empty.classList.remove('show');
    } catch (e) {
      if (id) return startCamera(null); // saved camera unplugged — fall back to default
      empty.classList.add('show');
    }
  }

  function apply(s) {
    b.classList.toggle('square', s.bubble.shape === 'square');
    b.classList.toggle('wide', s.bubble.shape === 'wide');
    v.classList.toggle('mirror', !!s.bubble.mirror);
    const minSide = Math.min(window.innerWidth, window.innerHeight) - 32;
    document.documentElement.style.setProperty('--btn', Math.round(Math.max(22, Math.min(30, minSide * 0.15))) + 'px');
    if (s.cameraId !== camId) { camId = s.cameraId; startCamera(camId); }
  }
  zri.getSettings().then(apply);
  zri.onSettings(apply);
  window.addEventListener('resize', () => zri.getSettings().then(apply));

  document.getElementById('smaller').onclick = () => zri.bubble.resize(-30);
  document.getElementById('bigger').onclick = () => zri.bubble.resize(30);
  document.getElementById('shape').onclick = () => zri.bubble.shape();
  document.getElementById('hide').onclick = () => zri.bubble.hide();

  // wheel = resize
  let wheelAcc = 0;
  b.addEventListener('wheel', (e) => {
    e.preventDefault();
    wheelAcc += e.deltaY;
    if (Math.abs(wheelAcc) >= 40) { zri.bubble.resize(wheelAcc > 0 ? -16 : 16); wheelAcc = 0; }
  }, { passive: false });

  // drag anywhere on the bubble
  let drag = null;
  let raf = 0;
  b.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button')) return;
    b.setPointerCapture(e.pointerId);
    drag = { sx: e.screenX, sy: e.screenY, wx: window.screenX, wy: window.screenY, x: window.screenX, y: window.screenY };
    b.classList.add('dragging');
  });
  b.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.x = Math.round(drag.wx + (e.screenX - drag.sx));
    drag.y = Math.round(drag.wy + (e.screenY - drag.sy));
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (drag) zri.bubble.move(drag.x, drag.y); });
  });
  const end = (e) => {
    if (!drag) return;
    try { b.releasePointerCapture(e.pointerId); } catch {}
    drag = null;
    b.classList.remove('dragging');
    zri.bubble.moveEnd();
  };
  b.addEventListener('pointerup', end);
  b.addEventListener('pointercancel', end);
</script>
</body>
</html>
